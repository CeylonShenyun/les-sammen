# 放到公网时套一层密码：书房本身没有登录，谁拿到网址谁就能读写你的书。
#   sudo apt install apache2-utils && sudo htpasswd -c /etc/nginx/les-sammen.htpasswd 你的用户名
# 证书用 certbot 之类自己配。/mcp 不对外，AI 在本机连 127.0.0.1。
server {
    listen 443 ssl;
    server_name books.example.com;
    # ssl_certificate     /etc/letsencrypt/live/books.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/books.example.com/privkey.pem;

    auth_basic "les-sammen";
    auth_basic_user_file /etc/nginx/les-sammen.htpasswd;

    client_max_body_size 200m;          # 上传书（跟 config.json 的 max_upload_mb 对上）
    location /mcp { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18050;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }
}
